<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">THE ART OF MY LIFE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">

        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-fill container my-5">
    <h3 class="mb-4 text-center">Send Me an Email</h3>
    <p class="text-center">
      Phone: <a href="tel:+639922032032">(+63) 992 203 2032</a>
    </p>

    <!-- Contact Form -->
    <form action="https://formsubmit.co/crhysdatul@gmail.com" method="POST" class="mx-auto" style="max-width: 600px;">
      <!-- Optional hidden inputs -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="thankyou.html">

      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" name="name" id="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" id="email" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" name="message" id="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Send Message</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-primary text-white text-center py-3">

    Contact: <a href="tel:+639922032032" class="text-white text-decoration-underline">(+63)9922032032</a>
